; ============================================
; AgroMate TFT Display Test — PlatformIO Configuration
; ============================================
; Multi-driver test suite for 3.5" 320x480 8-bit parallel TFT on ESP32-S3
; Tests: RM68140, ILI9486, ILI9488, ST7796

[platformio]
default_envs = rm68140

[env]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = COM6
monitor_port = COM6
monitor_dtr = 0
monitor_rts = 0

board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.flash_mode = dio

lib_deps = 
    bodmer/TFT_eSPI@^2.5.43

; Common 8-bit parallel TFT pins on ESP32-S3
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -DUSER_SETUP_LOADED=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_PARALLEL_8_BIT=1
    ; Data bus pins (current breadboard wiring)
    -DTFT_D0=43
    -DTFT_D1=44
    -DTFT_D2=39
    -DTFT_D3=40
    -DTFT_D4=41
    -DTFT_D5=42
    -DTFT_D6=48
    -DTFT_D7=45
    ; Control pins
    -DTFT_WR=47
    -DTFT_RD=20
    -DTFT_DC=38
    -DTFT_CS=21
    -DTFT_RST=14
    ; Fonts
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1

; --- Default: RM68140 Driver ---
[env:rm68140]
build_flags = 
    ${env.build_flags}
    -DRM68140_DRIVER=1

; --- Alternative 1: ILI9486 Driver ---
[env:ili9486]
build_flags = 
    ${env.build_flags}
    -DILI9486_DRIVER=1

; --- Alternative 2: ILI9488 Driver ---
[env:ili9488]
build_flags = 
    ${env.build_flags}
    -DILI9488_DRIVER=1

; --- Alternative 3: ST7796 Driver ---
[env:st7796]
build_flags = 
    ${env.build_flags}
    -DST7796_DRIVER=1
