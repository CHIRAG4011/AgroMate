; ============================================
; AgroMate ESP32 Firmware — PlatformIO Configuration
; ============================================
; Hardware: ESP32-S3 N16R8, RM68140 3.5" 8-bit parallel TFT,
;           OV7670 camera, INMP441 mic, MAX98357A amp

[env:esp32-s3]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = COM6
monitor_port = COM6
monitor_dtr = 0
monitor_rts = 0

; Memory configuration (8MB Flash / No PSRAM)
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.flash_mode = dio


; Build flags
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    ; ── Camera Support Configuration ──
    -DCONFIG_OV7670_SUPPORT=1
    -DCONFIG_OV2640_SUPPORT=0
    -DCONFIG_OV7725_SUPPORT=0
    -DCONFIG_OV3660_SUPPORT=0
    -DCONFIG_OV5640_SUPPORT=0
    -DCONFIG_NT99141_SUPPORT=0
    -DCONFIG_GC2145_SUPPORT=0
    -DCONFIG_GC032A_SUPPORT=0
    -DCONFIG_GC0308_SUPPORT=0
    -DCONFIG_BF3005_SUPPORT=0
    -DCONFIG_BF20A6_SUPPORT=0
    -DCONFIG_SC101IOT_SUPPORT=0
    -DCONFIG_SC030IOT_SUPPORT=0
    -DCONFIG_SC031GS_SUPPORT=0
    ; ── TFT_eSPI configuration for RM68140 8-bit parallel ──
    -DUSER_SETUP_LOADED=1
    -DRM68140_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_PARALLEL_8_BIT=1
    ; Data bus pins (conflict-free assignment)
    -DTFT_D0=43
    -DTFT_D1=44
    -DTFT_D2=39
    -DTFT_D3=40
    -DTFT_D4=41
    -DTFT_D5=42
    -DTFT_D6=48
    -DTFT_D7=45
    ; Control pins
    -DTFT_WR=47
    -DTFT_RD=-1
    -DTFT_DC=38
    -DTFT_CS=21
    -DTFT_RST=14
    ; Font loading (needed for text display)
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

; Libraries
lib_deps = 
    h2zero/NimBLE-Arduino@^2.1.0
    bodmer/TFT_eSPI@^2.5.43
    espressif/esp32-camera@^2.0.4
    bblanchon/ArduinoJson@^7.0.4
    fastled/FastLED@^3.6.0

build_src_filter = +<*> -<.git/> -<.svn/>
