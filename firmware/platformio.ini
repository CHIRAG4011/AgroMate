; ============================================
; AgroMate ESP32 Firmware — PlatformIO Configuration
; ============================================
; Hardware: ESP32-S3 N16R8, RM68140 3.5" 8-bit parallel TFT,
;           ESP32-CAM module (UART), INMP441 mic, MAX98357A amp

[env:esp32-s3]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = COM9
monitor_port = COM9
monitor_dtr = 0
monitor_rts = 0

; Memory configuration (8MB Flash / No PSRAM)
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.flash_mode = dio


; Build flags
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    ; ── Camera is on separate ESP32-CAM board (no local camera driver needed) ──
    ; ── TFT_eSPI configuration for RM68140 8-bit parallel ──
    -DUSER_SETUP_LOADED=1
    -DRM68140_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_PARALLEL_8_BIT=1
    ; Data bus pins (conflict-free assignment)
    -DTFT_D0=43
    -DTFT_D1=44
    -DTFT_D2=39
    -DTFT_D3=40
    -DTFT_D4=41
    -DTFT_D5=42
    -DTFT_D6=48
    -DTFT_D7=45
    ; Control pins
    -DTFT_WR=47
    -DTFT_RD=20
    -DTFT_DC=38
    -DTFT_CS=21
    -DTFT_RST=14
    ; Font loading (needed for text display)
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

; Libraries (esp32-camera removed — camera is on separate ESP32-CAM module)
lib_deps = 
    h2zero/NimBLE-Arduino@^2.1.0
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.4
    bodmer/TJpg_Decoder@^1.1.0

build_src_filter = +<*> -<.git/> -<.svn/>

