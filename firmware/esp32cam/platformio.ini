; ============================================
; AgroMate ESP32-CAM — Camera Node Firmware
; ============================================
; Module: AI-Thinker ESP32-CAM (OV2640, 4MB PSRAM)
; Purpose: UART-based camera node for AgroMate robot
; Protocol: Receives commands on Serial, sends JPEG images
; ============================================

[env:esp32cam]
platform = espressif32@6.5.0
board = esp32cam
framework = arduino
monitor_speed = 460800
upload_speed = 115200

; Upload settings for flashing ESP32-CAM via USB-UART adapter or bridge
; Connect IO0 to GND, press RESET, then upload. Remove IO0 from GND and press RESET to run.
; upload_port = COM9

; Build flags
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_GC2145_SUPPORT=1
    -DCONFIG_GC_SENSOR_SUBSAMPLE_MODE=1
    -DCONFIG_IDF_TARGET_ESP32=1
    -DARDUINO_LOOP_STACK_SIZE=32768
    -UCONFIG_ARDUHAL_ESP_LOG

; Libraries are in lib/esp32-camera
